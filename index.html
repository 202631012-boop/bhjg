<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 우산 챙길까?</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient-default: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --text-main: #2c3e50;
            --card-bg: rgba(255, 255, 255, 0.90);
            --card-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient-default);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            color: var(--text-main);
            transition: background 0.8s ease;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        header {
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            font-size: 0.95rem;
            color: #64748b;
        }

        .location-box {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }

        .check-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.4);
        }

        .loading-box {
            display: none;
            margin: 25px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .weather-status {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 15px 10px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .data-card .label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
        }

        .data-card .value {
            font-size: 1.7rem;
            font-weight: 900;
            color: #0f172a;
        }

        .data-card .value span {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .umbrella-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
        }

        .umbrella-card.danger {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .umbrella-card.warning {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .umbrella-card.safe {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .umbrella-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .umbrella-card.danger .umbrella-title { color: #dc2626; }
        .umbrella-card.warning .umbrella-title { color: #d97706; }
        .umbrella-card.safe .umbrella-title { color: #059669; }

        .umbrella-desc {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.5;
        }

        /* --- 체크리스트 섹션 --- */
        .checklist-container {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .checklist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .checklist-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checklist-progress {
            font-size: 0.8rem;
            font-weight: 600;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .checklist-input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .checklist-input-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .checklist-input-box input:focus {
            border-color: #3b82f6;
        }

        .add-item-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-item-btn:hover {
            background: #2563eb;
        }

        .checklist-ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
            transition: all 0.2s;
        }

        .checklist-item.checked {
            background: #f8fafc;
            opacity: 0.65;
        }

        .checklist-item.checked .item-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
        }

        .item-left input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .item-text {
            font-size: 0.9rem;
            color: #334155;
            font-weight: 500;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #ef4444;
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-umbrella" style="color: #3b82f6;"></i> 오늘 우산 챙길까?</h1>
            <p>내 위치 기반 실시간 강수확률 & 준비물 체크리스트</p>
        </header>

        <!-- 위치 정보 -->
        <div class="location-box">
            <i class="fa-solid fa-location-dot" style="color: #ef4444;"></i>
            <span id="locationName">내 위치 찾는 중...</span>
        </div>

        <!-- 메인 버튼 -->
        <button class="check-btn" onclick="getRainData()">
            <i class="fa-solid fa-umbrella"></i> 실시간 강수확률 & 강수량 확인
        </button>

        <!-- 로딩 표시 -->
        <div class="loading-box" id="loading">
            <div class="spinner"></div>
            <p style="font-size: 0.9rem; color: #475569;">위치 기반 기상 데이터 분석 중...</p>
        </div>

        <!-- 결과 표시 영역 -->
        <div class="result-container" id="resultContainer">
            <div class="weather-status" id="weatherIcon">
                <i class="fa-solid fa-cloud-showers-heavy"></i>
            </div>

            <div class="data-grid">
                <div class="data-card">
                    <div class="label">오늘 최고 강수확률</div>
                    <div class="value" id="rainPercent">--<span>%</span></div>
                </div>
                <div class="data-card">
                    <div class="label">예상 총 강수량</div>
                    <div class="value" id="rainAmount">--<span>mm</span></div>
                </div>
            </div>

            <!-- 우산 가이드 카드 -->
            <div class="umbrella-card" id="umbrellaCard">
                <div class="umbrella-title" id="umbrellaTitle">
                    <i class="fa-solid fa-umbrella"></i> 진단 결과
                </div>
                <div class="umbrella-desc" id="umbrellaDesc">
                    버튼을 눌러 강수확률을 확인하세요.
                </div>
            </div>
        </div>

        <!-- 外出 준비물 체크리스트 섹션 -->
        <div class="checklist-container">
            <div class="checklist-header">
                <h2><i class="fa-solid fa-list-check" style="color: #3b82f6;"></i> 외출 소지품 체크리스트</h2>
                <span class="checklist-progress" id="progressText">0 / 0 완료</span>
            </div>

            <div class="checklist-input-box">
                <input type="text" id="itemInput" placeholder="추가할 소지품 입력 (예: 텀블러)" onkeypress="if(event.key==='Enter') addItem()">
                <button class="add-item-btn" onclick="addItem()"><i class="fa-solid fa-plus"></i></button>
            </div>

            <ul class="checklist-ul" id="checklistUl">
                <!-- JS에서 동적 생성 -->
            </ul>
        </div>

        <footer>
            <p>© 2026 오늘 우산 챙길까? • Location-based Weather Checklist</p>
        </footer>
    </div>

    <script>
        let userLat = 37.5665; // 기본값: 서울 위도
        let userLon = 126.9780; // 기본값: 서울 경도

        // 기본 소지품 리스트
        const defaultItems = [
            { id: 1, text: "📱 스마트폰", checked: false },
            { id: 2, text: "💳 지갑 / 교통카드", checked: false },
            { id: 3, text: "🔑 집열쇠 / 차키", checked: false },
            { id: 4, text: "🎧 이어폰 / 에어팟", checked: false }
        ];

        let items = [];

        window.onload = function() {
            initLocation();
            loadChecklist();
        };

        function initLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLon}&accept-language=ko`);
                            const data = await res.json();
                            const address = data.address;
                            const district = address.city || address.county || address.borough || address.province || '내 위치';
                            document.getElementById('locationName').innerText = `${district} (${userLat.toFixed(2)}°, ${userLon.toFixed(2)}°)`;
                        } catch (e) {
                            document.getElementById('locationName').innerText = `내 위치 (${userLat.toFixed(2)}°, ${userLon.toFixed(2)}°)`;
                        }
                    },
                    (err) => {
                        document.getElementById('locationName').innerText = "서울특별시 (기본 위치)";
                    }
                );
            } else {
                document.getElementById('locationName').innerText = "서울특별시 (기본 위치)";
            }
        }

        // 체크리스트 로드
        function loadChecklist() {
            const saved = localStorage.getItem('umbrella_app_checklist');
            if (saved) {
                items = JSON.parse(saved);
            } else {
                items = [...defaultItems];
                saveChecklist();
            }
            renderChecklist();
        }

        // 체크리스트 저장
        function saveChecklist() {
            localStorage.setItem('umbrella_app_checklist', JSON.stringify(items));
        }

        // 체크리스트 렌더링
        function renderChecklist() {
            const ul = document.getElementById('checklistUl');
            ul.innerHTML = '';

            let completedCount = 0;

            items.forEach(item => {
                if (item.checked) completedCount++;

                const li = document.createElement('li');
                li.className = `checklist-item ${item.checked ? 'checked' : ''}`;

                li.innerHTML = `
                    <div class="item-left" onclick="toggleItem(${item.id})">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleItem(${item.id})">
                        <span class="item-text">${escapeHtml(item.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
                `;
                ul.appendChild(li);
            });

            document.getElementById('progressText').innerText = `${completedCount} / ${items.length} 완료`;
        }

        // 항목 추가
        function addItem() {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();
            if (!text) return;

            const newItem = {
                id: Date.now(),
                text: text,
                checked: false
            };

            items.push(newItem);
            saveChecklist();
            renderChecklist();
            input.value = '';
        }

        // 항목 토글
        function toggleItem(id) {
            items = items.map(item => item.id === id ? { ...item, checked: !item.checked } : item);
            saveChecklist();
            renderChecklist();
        }

        // 항목 삭제
        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveChecklist();
            renderChecklist();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 기상 데이터 조회 및 자동 우산 체크리스트 연동
        async function getRainData() {
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            
            resultContainer.style.display = 'none';
            loading.style.display = 'block';

            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${userLat}&longitude=${userLon}&daily=precipitation_probability_max,precipitation_sum&timezone=auto`;
                const response = await fetch(url);
                const data = await response.json();

                const maxPop = data.daily.precipitation_probability_max[0] || 0;
                const rainSum = data.daily.precipitation_sum[0] || 0;

                loading.style.display = 'none';
                resultContainer.style.display = 'block';

                updateUI(maxPop, rainSum);
            } catch (err) {
                console.error(err);
                alert("기상 데이터를 불러오지 못했습니다.");
                loading.style.display = 'none';
            }
        }

        function updateUI(pop, rainAmount) {
            document.getElementById('rainPercent').innerHTML = `${pop}<span>%</span>`;
            document.getElementById('rainAmount').innerHTML = `${rainAmount.toFixed(1)}<span>mm</span>`;

            const card = document.getElementById('umbrellaCard');
            const title = document.getElementById('umbrellaTitle');
            const desc = document.getElementById('umbrellaDesc');
            const icon = document.getElementById('weatherIcon');

            // 강수확률이 높을 경우 체크리스트에 '☔ 우산' 자동 추가
            if (pop >= 30 || rainAmount > 0) {
                ensureUmbrellaInChecklist();
            }

            if (pop >= 60 || rainAmount >= 5.0) {
                document.body.style.background = "linear-gradient(135deg, #667eea 0%, #764ba2 100%)";
                icon.innerHTML = '<i class="fa-solid fa-cloud-showers-heavy" style="color: #818cf8;"></i>';
                
                card.className = "umbrella-card danger";
                title.innerHTML = '<i class="fa-solid fa-umbrella"></i> 우산 꼭 챙기세요!';
                desc.innerHTML = `오늘 강수확률은 <strong>${pop}%</strong>, 예상 강수량은 <strong>${rainAmount.toFixed(1)}mm</strong>입니다. 장우산을 체크리스트에 넣었습니다!`;
            } 
            else if (pop >= 30 || rainAmount > 0) {
                document.body.style.background = "linear-gradient(135deg, #f6d365 0%, #fda085 100%)";
                icon.innerHTML = '<i class="fa-solid fa-cloud-sun-rain" style="color: #fbbf24;"></i>';
                
                card.className = "umbrella-card warning";
                title.innerHTML = '<i class="fa-solid fa-umbrella"></i> 접이식 우산 추천!';
                desc.innerHTML = `오늘 강수확률은 <strong>${pop}%</strong>, 예상 강수량은 <strong>${rainAmount.toFixed(1)}mm</strong>입니다. 휴대용 우산을 챙겨주세요!`;
            } 
            else {
                document.body.style.background = "linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)";
                icon.innerHTML = '<i class="fa-solid fa-sun" style="color: #f59e0b;"></i>';
                
                card.className = "umbrella-card safe";
                title.innerHTML = '<i class="fa-solid fa-face-smile"></i> 우산 안 챙겨도 돼요!';
                desc.innerHTML = `오늘 강수확률은 <strong>${pop}%</strong>이며 비 소식이 없습니다. 가벼운 발걸음으로 출발하세요!`;
            }
        }

        function ensureUmbrellaInChecklist() {
            const hasUmbrella = items.some(item => item.text.includes("우산"));
            if (!hasUmbrella) {
                items.unshift({
                    id: Date.now(),
                    text: "☔ 우산 (비 예보)",
                    checked: false
                });
                saveChecklist();
                renderChecklist();
            }
        }
    </script>
</body>
</html>
