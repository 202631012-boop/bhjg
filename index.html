<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘우산 - 외출 체크리스트</title>
  <style>
    :root {
      --primary-color: #3B82F6;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-color: #1E293B;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 28px 24px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    header p {
      margin: 8px 0 0;
      color: #64748B;
      font-size: 0.95rem;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--primary-color);
    }
    button.add-btn {
      padding: 12px 18px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background-color: #F1F5F9;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .item-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex: 1;
    }
    .item-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .item-label.completed span {
      text-decoration: line-through;
      color: #94A3B8;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #EF4444;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>☔ 오늘우산</h1>
      <p>외출 전 필수 소지품을 확인하세요</p>
    </header>

    <div class="input-group">
      <input type="text" id="todoInput" placeholder="추가할 항목 입력..." onkeypress="if(event.key==='Enter') addTodo()">
      <button class="add-btn" onclick="addTodo()">추가</button>
    </div>

    <ul id="todoList">
      <li>
        <label class="item-label">
          <input type="checkbox" onchange="toggleComplete(this)">
          <span>☔ 오늘 우산 챙기기</span>
        </label>
        <button class="delete-btn" onclick="deleteTodo(this)">삭제</button>
      </li>
      <li>
        <label class="item-label">
          <input type="checkbox" onchange="toggleComplete(this)">
          <span>💳 지갑 및 카드</span>
        </label>
        <button class="delete-btn" onclick="deleteTodo(this)">삭제</button>
      </li>
      <li>
        <label class="item-label">
          <input type="checkbox" onchange="toggleComplete(this)">
          <span>📱 스마트폰</span>
        </label>
        <button class="delete-btn" onclick="deleteTodo(this)">삭제</button>
      </li>
    </ul>
  </div>

  <script>
    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;

      const ul = document.getElementById('todoList');
      const li = document.createElement('li');
      li.innerHTML = `
        <label class="item-label">
          <input type="checkbox" onchange="toggleComplete(this)">
          <span>${text}</span>
        </label>
        <button class="delete-btn" onclick="deleteTodo(this)">삭제</button>
      `;
      ul.appendChild(li);
      input.value = '';
    }

    function toggleComplete(checkbox) {
      const label = checkbox.closest('.item-label');
      if (checkbox.checked) {
        label.classList.add('completed');
      } else {
        label.classList.remove('completed');
      }
    }

    function deleteTodo(btn) {
      btn.closest('li').remove();
    }
  </script>

</body>
</html>
